<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digit 1 Math Maze</title>
    <link rel="stylesheet" href="WA14_digit1Mase.css">
</head>
<body>
    <header>
        <h1>Phone Number Casino</h1>
        <p>Secure Phone Number Verification System</p>
    </header>

    <main>
        <section class="maze">
            <h2>Math Verification Maze</h2>

            <div class="mazeInfo">
                <p>Verifying Digit 1 of 10</p>
                <p>Strikes: 0/3</p>
            </div>

            <div class="mazeContainer">
                <div class="mazeGrid">
                    <div class="checkpoint start">
                        <h3>1</h3>
                        <p>START</p>
                    </div>

                    <div class="checkpoint question">
                        <h3>2</h3>
                        <p>QUESTION</p>
                    </div>

                    <div class="checkpoint guard">
                        <h3>3</h3>
                        <p>GUARD</p>
                    </div>

                    <div class="checkpoint question">
                        <h3>4</h3>
                        <p>QUESTION</p>
                    </div>

                    <div class="checkpoint question">
                        <h3>5</h3>
                        <p>QUESTION</p>
                    </div>

                    <div class="checkpoint guard">
                        <h3>6</h3>
                        <p>GUARD</p>
                    </div>
                </div>
            </div>

        </section>
    </main>
    
</body>
</html>
