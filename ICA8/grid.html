<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICA8 CSS Grids 2</title>
    <style>
        body {
            font: 1.2em / 1.5 sans-serif;
        }
    
        .grid > * {
            border-radius: 0.5em;
            color: white;
            padding: 0.5em;
        }
    
        .item1 {
            background-color: rgb(74 102 112 / 70%);
            border: 5px solid rgb(74 102 112);
        }
    
        .item2 {
            background-color: rgb(214 162 173 / 70%);
            border: 5px solid rgb(214 162 173);
        }
    
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(3, 100px);
            gap: 10px;
        }
    
        .item1 {
            grid-column: 1 / 4;
            grid-row: 1 / 3;
        }
    
        .item2 {
            grid-column: 2 / 5;
            grid-row: 2 / 4;
        }
    </style>

</head>
<body>
    <h1>CSS Grids 2</h1>

    <div class="grid">
        <div class="item1">One</div>
        <div class="item2">Two</div>
    </div>
</body>
</html>
